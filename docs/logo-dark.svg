<svg width="520" height="120" viewBox="0 0 520 120" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>claude-js-boilerplate</title>
  <desc>Isometric stacked-layers mark alongside the wordmark "claude-js-boilerplate" — dark theme.</desc>

  <!-- Layer 3 — integrations (orange) -->
  <g transform="translate(76,81)">
    <polygon points="0,-20 60,-10 60,8 0,18 -60,8 -60,-10" fill="#f97316"/>
    <polygon points="60,-10 60,8 0,18 0,0" fill="rgba(0,0,0,0.22)"/>
    <polygon points="-60,-10 -60,8 0,18 0,0" fill="rgba(255,255,255,0.13)"/>
  </g>
  <!-- Layer 2 — base (green) -->
  <g transform="translate(76,61)">
    <polygon points="0,-20 60,-10 60,8 0,18 -60,8 -60,-10" fill="#10b981"/>
    <polygon points="60,-10 60,8 0,18 0,0" fill="rgba(0,0,0,0.22)"/>
    <polygon points="-60,-10 -60,8 0,18 0,0" fill="rgba(255,255,255,0.13)"/>
  </g>
  <!-- Layer 1 — core (blue) -->
  <g transform="translate(76,41)">
    <polygon points="0,-20 60,-10 60,8 0,18 -60,8 -60,-10" fill="#3b82f6"/>
    <polygon points="60,-10 60,8 0,18 0,0" fill="rgba(0,0,0,0.22)"/>
    <polygon points="-60,-10 -60,8 0,18 0,0" fill="rgba(255,255,255,0.13)"/>
    <polygon points="0,-8 12,0 0,8 -12,0" fill="#8b5cf6"/>
  </g>

  <!-- Divider -->
  <line x1="152" y1="22" x2="152" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="168" y="54"  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="26" fill="#ffffff" letter-spacing="0.4">claude-js</text>
  <text x="168" y="82"  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="26" fill="#ffffff" letter-spacing="0.4">boilerplate</text>
  <text x="170" y="100" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#666666" letter-spacing="2.5">COMPOSABLE · CLAUDE CODE · STARTER</text>
</svg>
